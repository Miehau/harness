<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Plan · Inspector</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11151b;color:#e1e6ee;font:15px system-ui}header{padding:24px 28px;border-bottom:1px solid #39414d}h1{margin:0;font-size:24px}h2{font-size:20px}h3{font-size:16px}p{line-height:1.5}small,.muted{color:#abb8ca}button,input{font:inherit;color:inherit;background:#202936;border:1px solid #526078;border-radius:6px;padding:8px 12px}button{cursor:pointer}button:hover,button[aria-pressed=true]{background:#344866}button:focus-visible,input:focus-visible{outline:2px solid #9fc6ff;outline-offset:2px}button:disabled{opacity:.5}#layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:80vh}nav{padding:20px;border-right:1px solid #39414d}nav button{display:block;width:100%;text-align:left;margin:10px 0;overflow-wrap:anywhere}main{padding:16px 28px;min-width:0}section{border-top:1px solid #39414d;padding:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1016;padding:16px;border-radius:8px;max-height:65vh;overflow:auto}code{overflow-wrap:anywhere}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.files{display:flex;gap:8px;flex-wrap:wrap;max-height:240px;overflow:auto}.files button{font:13px ui-monospace,monospace}#connection,#notice{color:#ffd493}summary{cursor:pointer}li{margin:10px 0;overflow-wrap:anywhere}#filter{width:100%}@media(max-width:720px){#layout{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid #39414d}main{padding:16px}}

body{background:#f4f6fa;color:#253247;font-size:14px}header{background:#fff;border-color:#e0e6ef;padding:22px 28px}h1{letter-spacing:-.7px}h2,h3{letter-spacing:-.3px}.muted,small{color:#69788d}#layout{grid-template-columns:230px minmax(0,1fr)}nav{background:#edf1f7;border-color:#dce3ee}button,input{background:#fff;color:#33445c;border-color:#d5deeb}button:hover,button[aria-pressed=true]{background:#e6eefc;border-color:#8aabe2}nav button{white-space:pre-line;line-height:1.7}main{padding:24px}#detail{display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,.85fr);gap:24px;align-items:start}#metadata>section{border:0;padding:18px;background:#fff;border-radius:12px;margin:18px 0;box-shadow:0 1px 3px #192f4e0a}#metadata>h2{font-size:25px;margin-top:0}#metadata>p{overflow-wrap:anywhere}#artifacts{position:sticky;top:18px;background:#fff;border:1px solid #dce3ee;border-radius:12px;padding:20px;min-width:0}#artifacts h2{margin-top:0}.files{display:block;margin-top:14px;max-height:340px;overflow:auto}.file-tree{list-style:none;margin:0;padding-left:16px;border-left:1px solid #dce3ee}.file-tree li{margin:2px 0}.file-tree button{border:0;background:transparent;text-align:left;overflow-wrap:anywhere}.file-tree details{margin:3px 0}.file-tree summary{padding:6px;font:12px ui-monospace,monospace}.step-files{max-height:260px;overflow:auto}.files button{font-size:11px;padding:6px 8px}pre{background:#f5f7fb;color:#30435e;border:1px solid #e2e8f1;font:12px/1.7 ui-monospace,monospace;max-height:55vh}.agent-card{border:1px solid #dce3ee;border-radius:10px;padding:16px;margin:12px 0;background:#fcfdff}.agent-card.worker{margin-left:24px;border-left:3px solid #a4bce7}.agent-card h3{margin:0}.agent-card .row{justify-content:space-between}.badge{font-size:11px;border-radius:20px;padding:4px 9px;background:#edf1f7;color:#52637b}.badge.completed{background:#e3f5ec;color:#17694a}.badge.failed,.badge.waiting{background:#fff0d6;color:#875c16}.artifact-link{margin:5px 6px 5px 0;font-size:12px;color:#305eaa}.agent-card details{margin-top:10px;color:#69788d}#connection{font-size:12px;color:#517267;margin-bottom:0}#notice{color:#8c601e}.flow-label{color:#6c7c94;font-size:12px;margin:18px 0 6px 24px}details{margin:12px 0}#artifact-viewer:empty:after{content:'Select an assignment, report or verification result to read it here.';display:block;color:#7a8799;line-height:1.8;padding:32px 0}#artifact-viewer h3{overflow-wrap:anywhere}@media(max-width:1000px){#detail{grid-template-columns:1fr}#artifacts{position:static}}@media(max-width:720px){#layout{grid-template-columns:1fr}main{padding:16px}#detail{display:block}}
</style>
<header><h1>Agent Plan <span class="muted">/ Inspector</span></h1><p id="connection" role="status">Connecting…</p></header>
<div id="layout"><nav aria-label="Tasks"><label for="filter">Filter tasks</label><input id="filter" type="search" placeholder="Repo, ID or status"><div id="tasks"></div></nav><main><p id="notice" role="status"></p><div id="detail">Select a task to inspect.</div></main></div>
<script>
const tokenKey='agent-plan-owner';
if(location.hash.length>1){sessionStorage.setItem(tokenKey,location.hash.slice(1));history.replaceState(null,'',location.pathname+location.search)}
const token=sessionStorage.getItem(tokenKey);
const el=(tag,value)=>{const n=document.createElement(tag);if(value!==undefined)n.textContent=value;return n};
const button=(label,fn)=>{const n=el('button',label);n.type='button';n.onclick=()=>Promise.resolve().then(fn).catch(error=>document.querySelector('#notice').textContent=error.message);return n};
let tasks=[], selected=new URLSearchParams(location.search).get('task'), signature='', fileGeneration=0;
async function api(path,body){const response=await fetch(path,{method:body?'POST':'GET',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const result=await response.json();if(!response.ok)throw Error(result.error||'Request failed');return result}
const action=(taskId,action,input={})=>api('/action',{taskId,action,input,requestId:crypto.randomUUID()});
function list(){const host=document.querySelector('#tasks');host.replaceChildren();const query=document.querySelector('#filter').value.toLowerCase();for(const task of tasks.filter(t=>`${t.repo} ${t.id} ${t.status}`.toLowerCase().includes(query))){const b=button(`${task.status} · ${task.id.slice(0,8)}\n${task.repo.split('/').pop()}`,()=>select(task.id));b.setAttribute('aria-pressed',String(task.id===selected));host.append(b)}if(!tasks.length)host.append(el('p','No tasks yet. Start one with agent-plan start.'))}
function select(id){selected=id;signature='';history.replaceState(null,'',`?task=${encodeURIComponent(id)}`);list();render()}
function render(){const task=tasks.find(t=>t.id===selected);if(!task)return;const next=JSON.stringify(task);if(next===signature)return;signature=next;
// Update live metadata separately so polling never closes the artifact being read.
let meta=document.querySelector('#metadata');if(!meta||meta.dataset.task!==task.id){fileGeneration++;const detail=document.querySelector('#detail');detail.replaceChildren();meta=el('div');meta.id='metadata';meta.dataset.task=task.id;const artifacts=el('section');artifacts.id='artifacts';artifacts.append(el('h2','Evidence reader'),el('p','Assignments, reports and command output — saved by this task.'));const files=el('div');files.className='files';const viewer=el('div');viewer.id='artifact-viewer';artifacts.append(button('Refresh files',()=>browse('.',files,viewer,task.id)),files,viewer);detail.append(meta,artifacts);browse('.',files,viewer,task.id).catch(error=>viewer.textContent=error.message)}meta.replaceChildren();meta.append(el('h2',`${task.status} · ${task.id.slice(0,8)}`),el('p',task.repo));const row=el('div');row.className='row';row.append(button('Open in Herdr',async()=>{await action(task.id,'open');document.querySelector('#notice').textContent='Opened the task workspace in Herdr.'}),el('small',`Created ${new Date(task.createdAt).toLocaleString()}`));meta.append(row);
const summary=el('section');summary.append(el('h3','Result & verification'),el('p',task.verification?`${task.verification.passed?'Passed':'Failed'} · commit ${task.verification.commit}`:'No verification recorded yet.'));if(task.result)summary.append(artifactButton(task.id,task.result,'Read final handoff'));if(task.verification?.artifact)summary.append(artifactButton(task.id,task.verification.artifact,'Inspect verification'));if(task.integration)summary.append(el('p',`Integration worktree: ${task.integration.cwd}`));if(task.delivery)summary.append(el('p',`Delivery: ${task.delivery.phase} · ${task.delivery.target}`));if(task.status==='completed'&&task.verification?.passed&&!task.operation&&task.delivery?.phase!=='merged')summary.append(button('Accept · rebase and merge into main',async()=>{await action(task.id,'accept',{commit:task.verification.commit,target:'main'});document.querySelector('#notice').textContent='Accepted candidate merged into main.';signature='';}));meta.append(summary);
const agents=el('section');agents.append(el('h3','Delegation & handoffs'));
for(const [index,a] of task.agents.entries()){
 if(a.role==='worker'){const flow=el('p','↓ Assigned by coordinator · '+new Date(a.createdAt).toLocaleTimeString());flow.className='flow-label';agents.append(flow)}
 const card=el('article');card.className='agent-card '+(a.role==='worker'?'worker':'');
 const heading=el('div');heading.className='row';const badge=el('span',a.status);badge.className='badge '+a.status;heading.append(el('h3',a.role==='orchestrator'?'Coordinator':`Worker ${index} · ${a.stage|| (a.mode==='write'?'Implementation':'Exploration')}`),badge);card.append(heading);
 card.append(el('p',a.role==='orchestrator'?'Owns the plan, worker decisions and verified integration.':a.status==='failed'?'Attempt failed; inspect its failure details and retained files below.':a.integrated?'Output integrated into the task branch.':a.report?'Report received; inspect the output below.':'Assignment issued; awaiting a worker report.'));
 for(const [label,path] of [['Read assignment',a.assignment||(a.role==='orchestrator'?'brief.md':null)],['Shared contract',a.contract],['Read output',a.report],['Failure details',a.failure],['Last checkpoint',a.checkpoint],['Last command',a.lastCommand]])if(path)card.append(artifactButton(task.id,path,label));
 if(a.error)card.append(el('p',a.error));
 const outputs=el('details');outputs.open=true;outputs.append(el('summary','Output files'));const outputFiles=el('div');outputFiles.className='step-files';outputs.append(outputFiles);outputs.ontoggle=()=>{if(outputs.open)browse(a.artifactDir||(a.role==='orchestrator'?'orchestrator':`workers/${a.id}`),outputFiles,document.querySelector('#artifact-viewer'),task.id).catch(e=>outputFiles.textContent=e.message)};card.append(outputs);
 const info=el('details');info.append(el('summary','Session, worktree & commits'),el('pre',`Agent: ${a.id}\nHerdr tab: ${a.place?.tab||'Not launched'}\nWorktree: ${a.cwd}\nCommit: ${a.commit||'Not recorded'}\nIntegrated: ${a.integrated||'Not recorded'}\nModel: ${a.modelSelection?.provider||task.config.provider||'Pi default'}/${a.modelSelection?.model||task.config.model||'Pi default'}\nChoice: ${a.modelChoice||'inherited'}\nReason: ${a.modelReason||'Not recorded'}`));card.append(info);agents.append(card)
}meta.append(agents);
if(task.clarification){meta.append(el('p',`Clarification recorded · ${new Date(task.clarification.at).toLocaleString()}`),artifactButton(task.id,task.clarification.artifact,'Read clarification'));}
const documents=el('section');documents.append(el('h3','Current documents'));for(const [name,path] of Object.entries(task.documents||{}))documents.append(artifactButton(task.id,path,name));if(Object.keys(task.documents||{}).length)meta.append(documents);
const decisions=el('section');decisions.append(el('h3','Decisions & recovery'));if(!task.decisions.length&&!task.operation&&!task.pendingActions?.length)decisions.append(el('p','No decisions or interrupted operations.'));for(const d of task.decisions){decisions.append(el('p',`${d.answer?'Answered':'Waiting'} · ${d.id}`),artifactButton(task.id,d.artifact));for(const attachment of d.attachments||[])decisions.append(artifactButton(task.id,attachment,'View attachment'));if(d.answer)decisions.append(artifactButton(task.id,d.answer))}if(task.operation||task.pendingActions?.length)decisions.append(el('pre',JSON.stringify({operation:task.operation,pendingActions:task.pendingActions},null,2)));meta.append(decisions);
const timeline=el('details');timeline.append(el('summary',`Timeline · ${task.events.length} events`));const events=el('ol');for(const e of task.events){const li=el('li',`${new Date(e.at).toLocaleString()} · ${e.kind}`);if(e.artifact)li.append(' ',artifactButton(task.id,e.artifact));events.append(li)}timeline.append(events);meta.append(timeline);const raw=el('details');raw.append(el('summary','Full task state'),el('pre',JSON.stringify(task,null,2)));meta.append(raw)}
function artifactButton(taskId,path,label=path){const b=button(label,()=>showFile(taskId,path,document.querySelector('#artifact-viewer')));b.className='artifact-link';b.title=path;return b}
async function browse(path,files,viewer,taskId){
 const data=await action(taskId,'read',{area:'artifacts',path});if(taskId!==selected||!files.isConnected)return;
 const tree=el('ul');tree.className='file-tree';
 for(const name of data.entries||[]){
  const child=path==='.'?name:`${path}/${name}`,li=el('li');
  if(data.directories?.includes(name)){
   const folder=el('details');const owner=tasks.find(t=>t.id===taskId)?.agents.find(a=>a.id===name);folder.append(el('summary','📁 '+(owner?`${owner.stage||owner.role} · ${name.slice(0,8)}`:name)));const nested=el('div');folder.append(nested);let loaded=false;
   folder.ontoggle=async()=>{if(folder.open&&!loaded){try{await browse(child,nested,viewer,taskId);loaded=true}catch(e){nested.textContent=e.message}}};li.append(folder);
  }else li.append(artifactButton(taskId,child,name));
  tree.append(li);
 }
 files.replaceChildren(tree);if(!data.entries?.length)files.append(el('p','No files saved yet.'));
}
async function showFile(taskId,path,viewer,data){const generation=++fileGeneration;data??=await action(taskId,'read',{area:'artifacts',path,limit:100000});if(generation!==fileGeneration||taskId!==selected)return;viewer.replaceChildren(el('h3',path));if(data.entries){viewer.append(el('p','Directory: select its files in the artifact list.'));return}if(data.mimeType==='image/png'){const img=el('img');img.alt=path;img.style.maxWidth='100%';img.src='data:image/png;base64,'+data.base64;viewer.append(img);return}const pre=el('pre',data.content);viewer.append(pre);let offset=data.nextOffset;const more=button('Load more',async()=>{more.disabled=true;try{const part=await action(taskId,'read',{area:'artifacts',path,offset,limit:100000});if(generation!==fileGeneration)return;pre.textContent+=part.content;offset=part.nextOffset;more.hidden=offset===null}finally{more.disabled=false}});more.hidden=offset===null;viewer.append(more);if(matchMedia('(max-width:1000px)').matches)viewer.scrollIntoView({behavior:'smooth',block:'start'})}
async function refresh(){try{if(!token)throw Error('Run agent-plan dashboard and open the printed URL to connect.');tasks=(await api('/tasks')).reverse();document.querySelector('#connection').textContent=`Connected · ${tasks.length} tasks · Updated ${new Date().toLocaleTimeString()}`;if(!selected&&tasks.length)selected=tasks[0].id;list();render()}catch(error){document.querySelector('#connection').textContent=error.message}finally{setTimeout(refresh,5000)}}
document.querySelector('#filter').oninput=list;refresh();
</script></html>
