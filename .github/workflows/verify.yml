name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install video verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Jujutsu (default workspace VCS)
        run: |
          curl --fail --location --silent --show-error https://github.com/jj-vcs/jj/releases/download/v0.44.0/jj-v0.44.0-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/jj.tar.gz"
          tar -xzf "$RUNNER_TEMP/jj.tar.gz" -C "$RUNNER_TEMP" ./jj
          sudo install "$RUNNER_TEMP/jj" /usr/local/bin/jj
          jj --version
      - run: npm ci
      # The fixture suite has a real /proc adapter only on Linux; this required
      # job keeps its cancellation, escalation, identity, and leak assertions
      # from being silently replaced by platform skips.
      - run: node .agent-plan/verify.mjs
